name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer le projet
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Verifier que la CLI tourne de bout en bout
        run: |
          suukalia --db "${RUNNER_TEMP}/ci.sqlite3" init --bankroll 200
          suukalia --db "${RUNNER_TEMP}/ci.sqlite3" analyse -v
          suukalia simulate --bets 100 --trials 200
